# Всё, что приходит на этот сервер, требует Basic Auth — и сайт, и API.
server {
    listen 80;
    server_name _;

    # ---- защита паролем (файл .htpasswd монтируется из docker-compose) ----
    auth_basic           "Private AI Assistant";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ---- API: проксируем на backend с отключённой буферизацией (иначе SSE «залипает») ----
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering  off;
        proxy_cache      off;
        gzip             off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- статика SPA ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # доступ к .htpasswd через веб закрыт
    location ~ /\.ht {
        deny all;
    }
}
